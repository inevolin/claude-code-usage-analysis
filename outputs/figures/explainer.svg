<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Animated explainer in five slides, with a slide timer along the bottom. 1. Claude saves your chat for a short time, so each new message is cheap: 1 hour on a Pro, Max or Ultra plan, 5 minutes on an API key. Every message restarts the timer. 2. Come back after the timer runs out, and your next message costs about 10x: new chat 1x, back before the timer ends 1.5x, back after it ends 9.8x. Claude has to save the whole chat again. Measured 13 times on an API key. 3. Taking a break? Shrink the chat first. Type /compact. About 2.5x instead of 10x. 4. Back from a break? Start a new chat. Keeping going in the old chat costs 9.8x (crossed out). A new chat with a 3-line note (Goal, Done, Next) costs 1x. Type /clear, then write Goal, Done and Next. 5. Found this useful? Star the repo on GitHub: github.com/inevolin/claude-code-usage-analysis."><title>Claude saves your chat for a short time. Come back after the timer runs out, and your next message costs about 10x.</title><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.bg{fill:#FAF9F5}.card{fill:#FFFFFF;stroke:#E8E6DC}.ink{fill:#141413}.muted{fill:#5E5D59}.acc{fill:#C2603F}.good{fill:#2F7A55}.warm{fill:#BFC9C2}.cold{fill:#D97757}.track{fill:#E8E6DC}.goodbar{fill:#3E9A6C}.seg{fill:#CFCCC1}.segfill{fill:#D97757}@media (prefers-color-scheme:dark){.bg{fill:#1F1E1D}.card{fill:#262624;stroke:#3D3929}.ink{fill:#F0EEE6}.muted{fill:#A6A39A}.acc{fill:#E8906F}.good{fill:#7FC29E}.warm{fill:#55605A}.cold{fill:#D97757}.track{fill:#353432}.goodbar{fill:#5DB487}.seg{fill:#4A4845}.segfill{fill:#E8906F}}@keyframes a0{0.000%{opacity:0}1.698%{opacity:1}20.000%{opacity:1}21.698%{opacity:0}100.000%{opacity:0}}.a0{opacity:0;animation:a0 26.5s linear infinite both}@keyframes a1{0.000%{transform:scaleX(0)}3.019%{transform:scaleX(0)}14.340%{transform:scaleX(1)}21.698%{transform:scaleX(1)