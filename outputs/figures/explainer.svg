800">Start a new chat.</tspan></text><text x="80" y="492" font-size="24" font-weight="400" text-anchor="start" xml:space="preserve"><tspan class="muted" font-weight="500">Type </tspan><tspan class="ink" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">/clear</tspan><tspan class="muted" font-weight="500">, then write Goal, Done and Next. About 1x instead of 9.8x.</tspan></text><text x="80" y="590" font-size="24" font-weight="700" text-anchor="start" class="acc">★ Found this useful? Star the repo on GitHub.</text></g></svg>
