.a19{transform:scaleX(0);transform-box:fill-box;transform-origin:0 50%;animation:a19 26.5s linear infinite both}@keyframes a20{0.000%{transform:scaleX(0)}65.094%{transform:scaleX(0)}86.792%{transform:scaleX(1)}100.000%{transform:scaleX(1)}}.a20{transform:scaleX(0);transform-box:fill-box;transform-origin:0 50%;animation:a20 26.5s linear infinite both}@keyframes a21{0.000%{transform:scaleX(0)}86.792%{transform:scaleX(0)}100.000%{transform:scaleX(1)}100.000%{transform:scaleX(1)}}.a21{transform:scaleX(0);transform-box:fill-box;transform-origin:0 50%;animation:a21 26.5s linear infinite both}@media (prefers-reduced-motion:reduce){*{animation:none!important}.sc{opacity:0!important}.stepper{display:none}.rm{opacity:1}}</style><rect width="1200" height="675" rx="24" class="bg"/><g class="sc a0"><text x="80" y="130" font-size="50" font-weight="400" text-anchor="start" xml:space="preserve"><tspan class="ink" font-weight="800">Claude saves your chat for a short time,</tspan></text><text x="80" y="202" font-size="50" font-weight="400" text-anchor="start" xml:space="preserve"><tspan class="good" font-weight="800">so each new message is cheap.</tspan></text><rect x="80" y="250" width="500" height="250" rx="20" class="card" stroke-width="2"/><text x="116" y="306" font-size="30" font-weight="700" text-anchor="start" class="muted">Pro, Max or Ultra plan</text><text x="116" y="396" font-size="72" font-weight="800" text-anchor="start" class="good">1 hour</text><rect x="116" y="436" width="428" height="26" rx="13" class="track"/><rect x="116" y="436" width="428" height="26" rx="13" class="goodbar a1"/><rect x="620" y="250" width="500" height="250" rx="20" class="card" stroke-width="2"/><text x="656" y="306" font-size="30" font-weight="700" text-anchor="start" class="muted">API key</text><text x="656" y="396" font-size="72" font-weight="800" text-anchor="start" class="good">5 minutes</text><rect x="656" y="436" width="428" height="26" rx="13" class="track"/><rect x="656" y="436" width="428" height="26" rx="13" class="goodbar a1"/><text x="80" y="560" font-size="28" font-weight="400" text-anchor="start" xml:space="preserve"><tspan class="muted" font-weight="500">Every message restarts the timer.</tspan></text></g><g class="sc a2"><text x="80" y="130" font-size="50" font-weight="400" text-anchor="start" xml:space="preserve"><tspan class="ink" font-weight="800">Come back after the timer runs out,</tspan></text><text x="80" y="202" font-size="50" font-weight="400" text-anchor="start" xml:space="preserve"><tspan class="ink" font-weight="800">and your next message costs </tspan><tspan class="acc" font-weight="800">about 10x.</tspan></text><text x="80" y="306" font-size="28" font-weight="700" text-anchor="start" class="ink">New chat</text><rect x="500" y="262" width="60.0" height="64" rx="10" class="warm a3"/><g class="a4"><text x="576.0" y="308" font-size="40" font-weight="800" text-anchor="start" class="ink">1x</text></g><text x="80" y="394" font-size="28" font-weight="700" text-anchor="start" class="ink">Back before the timer ends</text><rect x="500" y="350" width="90.0" height="64" rx="10" class="warm a5"/><g class="a6"><text x="606.0" y="396" font-size="40" font-weight="800" text-anchor="start" class="ink">1.5x</text></g><text x="80" y="482" font-size="28" font-weight="700" text-anchor="start" class="ink">Back after it ends</text><rect x="500" y="438" width="588.0" height="64" rx="10" class="cold a7"/><g class="a8"><text x="1068.0" y="484" font-size="40" font-weight="800" text-anchor="end" class="bg">9.8x</text></g><text x="80" y="566" font-size="24" font-weight="400" text-anchor="start" xml:space="preserve"><tspan class="muted" font-weight="500">Claude has to save the whole chat again. Measured 13 times on an API key.</tspan></text></g><g class="sc a9"><text x="80" y="130" font-size="50" font-weight="400" text-anchor="start" xml:space="preserve"><tspan class="ink" font-weight="800">Taking a break?</tspan></text><text x="80" y="202" font-size="50" font-weight="400" text-anchor="start" xml:space="preserve"><tspan class="good" font-weight="800">Shrink the chat first.</tspan></text><rect x="80" y="300" width="1040" height="90" rx="14" class="track"/><text x="1100" y="356" font-size="28" font-weight="600" text-anchor="end" class="muted">your long chat</text><rect x="80" y="300" width="1040" height="90" rx="14" class="warm a10"/><g class="a11"><text x="340" y="356" font-size="32" font-weight="800" text-anchor="start" class="good">short summary</text></g><text x="80" y="520" font-size="28" font-weight="400" text-anchor="start" xml:space="preserve"><tspan class="muted" font-weight="500">Type </tspan><tspan class="ink" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">/compact</tspan><tspan class="muted" font-weight="500">. About 2.5x instead of 10x.</tspan></text></g><g class="sc a12"><text x="80" y="130" font-size="50" font-weight="400" text-anchor="start" xml:space="preserve"><tspan class="ink" font-weight="800">Back from a break?</tspan></text><text x="80" y="202" font-size="50" font-weight="400" text-anchor="start" xml:space="preserve"><tspan class="good" font-weight="800">Start a new chat.</tspan></text><g class="a13"><rect x="80" y="250" width="440" height="270" rx="20" class="card" stroke-width="2"/><text x="110" y="300" font-size="26" font-weight="700" text-anchor="start" class="muted">Keep going in the old chat</text><path d="M150 340 h230 a16 16 0 0 1 16 16 v108 a16 16 0 0 1 -16 16 h-230 l-46 -70 z" class="cold"/><circle cx="138" cy="410" r="9" class="card"/><text x="278" y="438" font-size="76" font-weight="800" text-anchor="middle" class="bg">9.8x</text><g class="a14"><rect x="100" y="405" width="316" height="9" rx="4.5" class="ink" transform="rotate(-10 258 409)"/></g></g><g class="a15"><rect x="560" y="250" width="560" height="270" rx="20" class="card" stroke-width="2"/><text x="590" y="300" font-size="26" font-weight="700" text-anchor="start" class="muted">New chat with a 3-line note</text><text x="1092" y="486" font-size="120" font-weight="800" text-anchor="end" class="good">1x</text><text x="596" y="364" font-size="25" font-weight="400" text-anchor="start" xml:space="preserve"><tspan class="ink" font-weight="800">Goal: </tspan><tspan class="muted" font-weight="500">fix the rounding bug</tspan></text><text x="596" y="408" font-size="25" font-weight="400" text-anchor="start" xml:space="preserve"><tspan class="ink" font-weight="800">Done: </tspan><tspan class="muted" font-weight="500">a test shows the bug</tspan></text><text x="596" y="452" font-size="25" font-weight="400" text-anchor="start" xml:space="preserve"><tspan class="ink" font-weight="800">Next: </tspan><tspan class="muted" font-weight="500">patch money.py</tspan></text></g><text x="80" y="570" font-size="24" font-weight="400" text-anchor="start" xml:space="preserve"><tspan class="muted" font-weight="500">Type </tspan><tspan class="ink" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">/clear</tspan><tspan class="muted" font-weight="500">, then write Goal, Done and Next. About 1x instead of 9.8x.</tspan></text></g><g class="sc a16"><polygon points="600.0,120.0 573.0,192.8 495.4,196.0 556.3,244.2 535.3,319.0 600.0,276.0 664.7,319.0 643.7,244.2 704.6,196.0 627.0,192.8" class="cold"/><text x="600" y="420" font-size="56" font-weight="800" text-anchor="middle" class="ink">Found this useful?</text><text x="600" y="490" font-size="56" font-weight="800" text-anchor="middle" class="good">Star the repo on GitHub.</text><text x="600" y="560" font-size="28" font-weight="600" text-anchor="middle" class="muted">github.com/inevolin/claude-code-usage-analysis</text></g><g class="stepper"><rect x="80.0" y="628" width="196.8" height="10" rx="5" class="seg"/><rect x="80.0" y="628" width="196.8" height="10" rx="5" class="segfill a17"/><rect x="290.8" y="628" width="196.8" height="10" rx="5" class="seg"/><rect x="290.8" y=